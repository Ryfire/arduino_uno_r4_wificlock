[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino

; Build flags for include directory
build_flags =
    -I include

; Library dependencies
lib_deps =
    arduino-libraries/NTPClient@^3.2.1

; Regenerate include/scene_config.h from scene_config.json and
; include/simple_scenes.h from tools/scene_art_draft.py before each build
; (sequence order/timing, scene schedule; see tools/generate_*.py)
extra_scripts = pre:tools/generate_scene_config.py, pre:tools/generate_simple_scenes.py

; Serial monitor speed
monitor_speed = 115200